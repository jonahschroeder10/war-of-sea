<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=, initial-scale=1.0">
	<title>Schiffe Versenken - Startseite</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>Schiffe Versenken</h1>
	</header>
	<main>
		<h2>Willkommen zu Schiffe Versenken!</h2>

		<br>

		<label for="player-name">Spielername</label>
		<br>
		<input type="text" id="player-name" placeholder="Name eingeben">
		
		<br><br><br>

		<label for="board-size">Spielfeldgröße</label>
		<select id="board-size">
			<option value="8">8x8</option>
			<option value="10" selected>10x10</option>
			<option value="12">12x12</option>
		</select>

		<button id="new-game-button">Neues Spiel</button>
	</main>	
	<script>
		document.getElementById('new-game-button').addEventListener('click', function() {
			const playerName = document.getElementById('player-name').value;
			const boardSize = document.getElementById('board-size').value;

			localStorage.setItem('playerName', playerName);
			localStorage.setItem('boardSize', boardSize);

			const url = `game.html`;
			window.location.href = url;
		});
	</script>
</body>
</html>
